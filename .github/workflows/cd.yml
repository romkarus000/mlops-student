name: Deploy MLOps demo

on:
  workflow_run:
    workflows: ["Verify MLOps demo"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: vars
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SERVICE_VERSION=0.2.0
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/mlops-student
            git fetch origin main
            git checkout ${{ needs.build-and-push.outputs.sha }}
            export GITHUB_REPOSITORY=${{ github.repository }}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/mlops-student

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -sfL https://get.k3s.io | sh -
            fi
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            KUBECTL="k3s kubectl"

            $KUBECTL create secret docker-registry ghcr-pull \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password="$GHCR_TOKEN" \
              --dry-run=client -o yaml | $KUBECTL apply -f -

            sed \
              -e "s#IMAGE_PLACEHOLDER#ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.sha }}#" \
              -e "s#GIT_SHA_PLACEHOLDER#${{ needs.build-and-push.outputs.sha }}#" \
              -e "s#MLFLOW_TRACKING_URI_PLACEHOLDER#http://${{ secrets.DEPLOY_HOST }}:5000#" \
              k8s/deployment.yaml | $KUBECTL apply -f -
            $KUBECTL apply -f k8s/service.yaml

            $KUBECTL rollout status deployment/churn-api --timeout=120s

            curl -sf http://localhost:30080/health

            if curl -sf -X POST http://localhost:30080/predict \
              -H "Content-Type: application/json" \
              --data-binary @examples/predict_customer.json; then
              echo "predict smoke test: OK"
            else
              echo "predict smoke test: model not ready (no version behind the MLflow 'production' alias yet) - not failing the deploy, /health already confirms the service is up"
            fi
